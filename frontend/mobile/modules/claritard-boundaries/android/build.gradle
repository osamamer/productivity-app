plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'org.osama.solife'
version = '1.0.0'

android {
  namespace "org.osama.solife.boundaries"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  buildFeatures {
    aidl true
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.16.0"
  implementation "androidx.security:security-crypto:1.1.0"
  // Optional force-stop of blocked apps through Shizuku's adb-shell-privileged process.
  implementation "dev.rikka.shizuku:api:13.1.5"
  implementation "dev.rikka.shizuku:provider:13.1.5"
}
