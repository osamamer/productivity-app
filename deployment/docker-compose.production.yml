name: productivity-app

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      KEYCLOAK_DB: ${KEYCLOAK_DB:?KEYCLOAK_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - productivity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?KEYCLOAK_ADMIN_USER is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HTTP_RELATIVE_PATH: "/auth"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: "/"
      # Tokens keep the established public issuer while the web app reaches the same
      # service through APP_DOMAIN/auth. Changing this invalidates every backend request.
      KC_HOSTNAME: https://${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      APP_FAVICON_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/favicon.png
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes:ro
    command: start
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200' <&0; } 0<>/dev/tcp/localhost/9000"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - productivity-network

  backend:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/${KEYCLOAK_REALM:-productivity-app}
      KEYCLOAK_BASE_URL: https://${AUTH_DOMAIN}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-productivity-app}
      KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID: ${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-master}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # claritard://app is the web app bundled in the Linux desktop app's cloud mode.
      APP_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN},claritard://app
      APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: https://${APP_DOMAIN},claritard://app
      EXPO_PUSH_ACCESS_TOKEN: ${EXPO_PUSH_ACCESS_TOKEN:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-mailto:notifications@example.com}
      APP_POMODORO_SOUNDS_DIRECTORY: /var/lib/claritard/pomodoro-sounds
      TZ: ${TZ:-UTC}
    volumes:
      - pomodoro_sounds:/var/lib/claritard/pomodoro-sounds
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - productivity-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  edge:
    image: ${IMAGE_PREFIX:?IMAGE_PREFIX is required}-edge:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      MONITOR_USER: ${MONITOR_USER:?MONITOR_USER is required}
      MONITOR_PASSWORD_HASH: ${MONITOR_PASSWORD_HASH:?MONITOR_PASSWORD_HASH is required}
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - productivity-network

  # Netdata: host, container, PostgreSQL, endpoint and certificate metrics, served by the
  # edge at https://${APP_DOMAIN}/monitor/ behind basic auth. Its own network namespace is the
  # app network, so interface charts show container traffic, not the host's public NIC.
  # The Docker socket is only used to name containers; read-only does not limit the API, so
  # this container must never be published directly.
  monitor:
    image: netdata/netdata:v2.12.3
    restart: unless-stopped
    hostname: claritard-production
    pid: host
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    mem_limit: 512m
    environment:
      DO_NOT_TRACK: "1"
      PGID: ${DOCKER_GID:-999}
    volumes:
      - netdata_lib:/var/lib/netdata
      - netdata_cache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: netdata_conf
        target: /etc/netdata/netdata.conf
      - source: netdata_postgres
        target: /etc/netdata/go.d/postgres.conf
      - source: netdata_httpcheck
        target: /etc/netdata/go.d/httpcheck.conf
      - source: netdata_x509check
        target: /etc/netdata/go.d/x509check.conf
      - source: netdata_docker_discovery
        target: /etc/netdata/go.d/sd/docker.conf
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - productivity-network

configs:
  netdata_conf:
    content: |
      [db]
          mode = dbengine
          dbengine tier 0 retention size = 384MiB
          dbengine tier 1 retention size = 128MiB
          dbengine tier 2 retention size = 64MiB
      [web]
          bind to = *:19999
  netdata_postgres:
    content: |
      jobs:
        - name: production
          dsn: postgres://netdata:${MONITORING_DB_PASSWORD:?MONITORING_DB_PASSWORD is required}@postgres:5432/postgres
          collect_databases_matching: "*"
  netdata_httpcheck:
    content: |
      jobs:
        - name: public_app
          url: https://${APP_DOMAIN}/
          status_accepted: [200]
        - name: public_api_health
          url: https://${APP_DOMAIN}/actuator/health
          response_match: '"status":"UP"'
        - name: public_sign_in
          url: https://${APP_DOMAIN}/auth/realms/${KEYCLOAK_REALM:-productivity-app}/.well-known/openid-configuration
        - name: backend_internal
          url: http://backend:8080/actuator/health
          response_match: '"status":"UP"'
        - name: keycloak_internal
          url: http://keycloak:9000/health/ready
  # Discovery would add a second PostgreSQL job with guessed credentials that always fails.
  netdata_docker_discovery:
    content: |
      disabled: yes
  netdata_x509check:
    content: |
      jobs:
        - name: app_certificate
          source: https://${APP_DOMAIN}:443
        - name: auth_certificate
          source: https://${AUTH_DOMAIN}:443

volumes:
  postgres_data:
  pomodoro_sounds:
  caddy_data:
  caddy_config:
  netdata_lib:
  netdata_cache:

networks:
  productivity-network:
    driver: bridge
