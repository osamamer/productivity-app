parent=keycloak.v2
import=common/keycloak

# Keep Keycloak's accessible, upgradeable templates and layer the app's visual system on top.
styles=css/styles.css css/productivity.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
darkMode=true

# Use the same stable asset served by the public application origin. Keeping this
# configurable lets local Keycloak use Vite's source asset while production uses
# the edge image's un-hashed /favicon.png path.
appFaviconUrl=${env.APP_FAVICON_URL\:}
