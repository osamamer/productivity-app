name: Release mobile

# Publishes the production APK as a GitHub prerelease titled "Claritard Mobile ...".
# Obtainium on each Android device watches these (filter: prereleases on, title regex "Mobile").
# Prerelease keeps these out of /releases/latest, which the desktop auto-updater reads.
on:
  push:
    branches: [master]
    paths:
      - frontend/mobile/**
      - frontend/shared/**
      - .github/workflows/release-mobile.yml
  workflow_dispatch:

concurrency:
  group: release-mobile
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        run: |
          COUNT=$(git rev-list --count HEAD)
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "ANDROID_VERSION_CODE=$COUNT" >> "$GITHUB_ENV"
          echo "TAG=mobile-v${VERSION}-${COUNT}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/mobile/package-lock.json

      - run: npm ci

      # Signed with the debug keystore expo prebuild generates, the same key the
      # locally built APKs on your devices use, so these install as updates.
      - name: Build production APK
        run: npm run build:android:production

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "claritard-$TAG.apk"
          gh release create "$TAG" "claritard-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Claritard Mobile $TAG" \
            --notes "Automated production APK from \`${GITHUB_SHA::7}\`." \
            --prerelease
