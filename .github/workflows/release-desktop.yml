name: Release desktop

# Publishes the Linux AppImage and .deb plus latest-linux.yml as the latest GitHub
# release; installed copies pick it up through electron-updater (desktop/src/autoUpdate.js).
on:
  push:
    branches: [master]
    paths:
      - desktop/**
      - backend/**
      - frontend/react/**
      - frontend/shared/**
      - VERSION
      - .github/workflows/release-desktop.yml
  workflow_dispatch:

# A newer push cancels a release still building; only the latest commit is released. gh creates
# the release as a draft until every asset is uploaded, so a cancel never leaves a partial one.
concurrency:
  group: release-desktop
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # electron-updater needs a strictly increasing semver: <major>.<minor> from VERSION, commit count as patch.
      - name: Compute version
        run: |
          MAJOR_MINOR=$(cut -d. -f1,2 VERSION)
          echo "DESKTOP_VERSION=${MAJOR_MINOR}.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: |
          npm ci --prefix frontend/react
          npm ci --prefix desktop

      - name: Build bundled resources
        working-directory: desktop
        env:
          DESKTOP_JDK_HOME: ${{ env.JAVA_HOME }}
        run: npm run build:resources

      - name: Build packages
        working-directory: desktop
        run: |
          npm version --no-git-tag-version --allow-same-version "$DESKTOP_VERSION"
          npx electron-builder --linux --publish never

      # Repacks the .deb so updates can download only changed blocks, and writes its .blockmap
      # (the AppImage carries its blockmap inside). See desktop/src/debUpdater.js.
      - name: Prepare the .deb for differential updates
        working-directory: desktop
        run: node scripts/debDifferential.js "dist/claritard-desktop_${DESKTOP_VERSION}_amd64.deb" dist/latest-linux.yml

      - name: Publish release
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$DESKTOP_VERSION" --target "$GITHUB_SHA" --title "$DESKTOP_VERSION" --notes "" --latest \
            "dist/Claritard-${DESKTOP_VERSION}.AppImage" \
            "dist/claritard-desktop_${DESKTOP_VERSION}_amd64.deb" \
            "dist/claritard-desktop_${DESKTOP_VERSION}_amd64.deb.blockmap" \
            dist/latest-linux.yml
