# Production configuration is supplied through the container environment.
# Keep this profile separate from application-dev.properties so local development
# continues to use the Docker services published on localhost.

server.port=8080
server.address=0.0.0.0
server.shutdown=graceful
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

app.keycloak.base-url=${KEYCLOAK_BASE_URL}
app.keycloak.realm=${KEYCLOAK_REALM:productivity-app}
app.keycloak.password-verification-client-id=${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID:admin-cli}
app.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:master}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
app.keycloak.admin.username=${KEYCLOAK_ADMIN_USER}
app.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://app.example.com}
app.websocket.allowed-origin-patterns=${APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:https://app.example.com}
app.pomodoro.dev-seconds-mode=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
