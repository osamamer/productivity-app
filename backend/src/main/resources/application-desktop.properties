# Local mode of the Linux desktop app. The desktop shell supplies DESKTOP_DATA_DIR,
# DESKTOP_FRONTEND_DIR and a per-launch DESKTOP_AUTH_SECRET. Nothing here contacts the cloud.

server.address=127.0.0.1
server.port=${DESKTOP_PORT:47830}
server.shutdown=graceful
server.error.include-stacktrace=never

app.desktop.data-directory=${DESKTOP_DATA_DIR}
app.desktop.frontend-directory=${DESKTOP_FRONTEND_DIR}
app.desktop.auth-secret=${DESKTOP_AUTH_SECRET}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.liquibase.drop-first=false

app.pomodoro.sounds.directory=${app.desktop.data-directory}/pomodoro-sounds

app.cors.allowed-origins=http://127.0.0.1:${server.port}
app.websocket.allowed-origin-patterns=http://127.0.0.1:${server.port}

# Remote notification delivery would leave the machine, so both channels stay off.
app.notifications.push.enabled=false
app.notifications.web-push.vapid.public-key=
app.notifications.web-push.vapid.private-key=

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
