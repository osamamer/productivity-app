# Default Profile

# Server Configuration
server.port=8080
server.address=0.0.0.0

# Uploads are streamed to this persistent directory; the database stores only metadata.
app.pomodoro.sounds.directory=${APP_POMODORO_SOUNDS_DIRECTORY:./data/pomodoro-sounds}

# JPA Common Settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Reject oversized requests before the application copies them into persistent storage.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
spring.servlet.multipart.file-size-threshold=0
# Keep the servlet's staging file on the sound volume so transferTo can use a
# same-filesystem move instead of copying the entire MP3 a second time.
spring.servlet.multipart.location=${app.pomodoro.sounds.directory}/.uploads

# Liquibase Common Settings
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

app.keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:7070}
app.keycloak.realm=${KEYCLOAK_REALM:productivity-app}
app.keycloak.password-verification-client-id=${KEYCLOAK_PASSWORD_VERIFICATION_CLIENT_ID:admin-cli}
app.keycloak.admin.realm=${KEYCLOAK_ADMIN_REALM:master}
app.keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
app.keycloak.admin.username=${KEYCLOAK_ADMIN_USER:admin}
app.keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:adminpassword}

# Expo Push Service delivers application notifications to registered mobile devices.
app.notifications.push.enabled=${APP_NOTIFICATIONS_PUSH_ENABLED:true}
app.notifications.push.url=${APP_NOTIFICATIONS_PUSH_URL:https://exp.host/--/api/v2/push/send}
app.notifications.push.access-token=${EXPO_PUSH_ACCESS_TOKEN:}
