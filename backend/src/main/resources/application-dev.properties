spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Apply new changesets without recreating the schema so local data survives restarts.
spring.liquibase.drop-first=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:5173/auth/realms/productivity-app

app.keycloak.base-url=http://localhost:7070/auth

# Set POMODORO_DEV_SECONDS_MODE=true for 10-second Pomodoro durations while developing.
# The default keeps the normal 25/5/15-minute durations.
app.pomodoro.dev-seconds-mode=${POMODORO_DEV_SECONDS_MODE:false}
# Development-only credentials; production deployments must provide their own stable pair.
app.notifications.web-push.vapid.public-key=${WEB_PUSH_VAPID_PUBLIC_KEY:BNeYJwhc-HKKyZ0vUqv3d8wah-YKXOu4Ac2g9PTfp-Z1T2RBOWKqukLp73fovK7LazeO7TIW6UtKqPL9v1xF0wQ}
app.notifications.web-push.vapid.private-key=${WEB_PUSH_VAPID_PRIVATE_KEY:86yXeQaTGwVh5y6l_hY1HSZH0LDc3S6MzFrEPDFHevE}
app.notifications.web-push.vapid.subject=${WEB_PUSH_VAPID_SUBJECT:mailto:local@claritard.test}
logging.level.org.hibernate.sql.results.jdbc.internal.DeferredResultSetAccess=ERROR
