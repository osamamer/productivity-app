databaseChangeLog:
  - changeSet:
      id: 098-activities
      author: claude
      changes:
        - createTable:
            tableName: activity
            columns:
              - column: { name: activity_id, type: varchar(255), constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: varchar(255), constraints: { nullable: false } }
              - column: { name: name, type: varchar(60), constraints: { nullable: false } }
              - column: { name: color, type: varchar(16), constraints: { nullable: false } }
              - column: { name: display_order, type: int, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamp, constraints: { nullable: false } }
              - column: { name: soft_deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: activity, baseColumnNames: user_id, referencedTableName: app_user, referencedColumnNames: id, constraintName: fk_app_activity_user }
        - createIndex:
            tableName: activity
            indexName: idx_app_activity_user
            ifNotExists: true
            columns:
              - column: { name: user_id }
        - addColumn:
            tableName: calendar_event
            columns:
              - column: { name: activity_id, type: varchar(255) }
        - createIndex:
            tableName: calendar_event
            indexName: idx_app_calendar_event_activity
            ifNotExists: true
            columns:
              - column: { name: activity_id }
