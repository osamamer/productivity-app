databaseChangeLog:
  - changeSet:
      id: 018-create-note
      author: osama
      comment: Create user-owned note categories and notes
      changes:
        - createTable:
            tableName: note_category
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: normalized_name
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createTable:
            tableName: note
            columns:
              - column:
                  name: id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: text
              - column:
                  name: category_id
                  type: varchar(255)
              - column:
                  name: pinned
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: note_category
            columnNames: user_id, normalized_name
            constraintName: uq_app_note_category_user_normalized_name
        - addForeignKeyConstraint:
            baseTableName: note_category
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_note_category_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: note
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_note_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: note
            baseColumnNames: category_id
            referencedTableName: note_category
            referencedColumnNames: id
            constraintName: fk_note_category
            onDelete: SET NULL
            onUpdate: CASCADE
        - createIndex:
            tableName: note_category
            indexName: idx_app_note_category_user_id
            ifNotExists: true
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: note
            indexName: idx_app_note_user_id
            ifNotExists: true
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: note
            indexName: idx_app_note_category_id
            ifNotExists: true
            columns:
              - column:
                  name: category_id
        - createIndex:
            tableName: note
            indexName: idx_app_note_user_pinned_updated
            ifNotExists: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: pinned
              - column:
                  name: updated_at
      rollback:
        - dropTable:
            tableName: note
        - dropTable:
            tableName: note_category
