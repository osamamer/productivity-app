databaseChangeLog:
  - changeSet:
      id: 093-secret-stat-access
      author: codex
      comment: Protect secret statistics and issue short-lived password-verified access grants
      changes:
        - addColumn:
            tableName: stat_definition
            columns:
              - column:
                  name: secret
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - createTable:
            tableName: secret_stats_access
            columns:
              - column:
                  name: token_hash
                  type: varchar(64)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_app_secret_stats_access
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_app_secret_stats_access_user
                    references: app_user(id)
              - column:
                  name: expires_at
                  type: timestamp
                  constraints:
                    nullable: false
        - createIndex:
            tableName: secret_stats_access
            indexName: idx_app_secret_stats_access_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: secret_stats_access
            indexName: idx_app_secret_stats_access_expiry
            columns:
              - column:
                  name: expires_at
      rollback:
        - dropTable:
            tableName: secret_stats_access
        - dropColumn:
            tableName: stat_definition
            columnName: secret
