databaseChangeLog:
  - changeSet:
      id: 045-create-day-templates
      author: codex
      comment: Store reusable user-owned daily event and task templates
      changes:
        - createTable:
            tableName: day_template
            columns:
              - column:
                  name: template_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(120)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
        - createTable:
            tableName: day_template_event
            columns:
              - column:
                  name: event_template_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: all_day
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: time
              - column:
                  name: end_time
                  type: time
              - column:
                  name: time_zone
                  type: varchar(80)
                  constraints:
                    nullable: false
              - column:
                  name: reminder_minutes_before
                  type: int
        - createTable:
            tableName: day_template_task
            columns:
              - column:
                  name: task_template_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: display_order
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: scheduled_time
                  type: time
              - column:
                  name: tag
                  type: varchar(50)
              - column:
                  name: importance
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: day_template
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_app_day_template_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: day_template_event
            baseColumnNames: template_id
            referencedTableName: day_template
            referencedColumnNames: template_id
            constraintName: fk_app_day_template_event_template
            onDelete: CASCADE
            onUpdate: CASCADE
        - addForeignKeyConstraint:
            baseTableName: day_template_task
            baseColumnNames: template_id
            referencedTableName: day_template
            referencedColumnNames: template_id
            constraintName: fk_app_day_template_task_template
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            tableName: day_template
            indexName: idx_app_day_template_user_name
            ifNotExists: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: name
        - createIndex:
            tableName: day_template_event
            indexName: idx_app_day_template_event_template_order
            ifNotExists: true
            columns:
              - column:
                  name: template_id
              - column:
                  name: display_order
        - createIndex:
            tableName: day_template_task
            indexName: idx_app_day_template_task_template_order
            ifNotExists: true
            columns:
              - column:
                  name: template_id
              - column:
                  name: display_order
      rollback:
        - dropTable:
            tableName: day_template_task
        - dropTable:
            tableName: day_template_event
        - dropTable:
            tableName: day_template
