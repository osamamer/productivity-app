databaseChangeLog:
  - changeSet:
      id: 085-external-calendar-sources
      author: codex
      changes:
        - createTable:
            tableName: calendar_source
            columns:
              - column: { name: source_id, type: varchar(255), constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: varchar(255), constraints: { nullable: false } }
              - column: { name: calendar_id, type: varchar(255), constraints: { nullable: false } }
              - column: { name: source_type, type: varchar(24), constraints: { nullable: false } }
              - column: { name: source_url, type: text }
              - column: { name: source_payload, type: text }
              - column: { name: last_synced_at, type: timestamp }
              - column: { name: last_error, type: varchar(255) }
              - column: { name: soft_deleted, type: boolean, defaultValueBoolean: false, constraints: { nullable: false } }
        - addColumn:
            tableName: calendar_event
            columns:
              - column: { name: source_id, type: varchar(255) }
              - column: { name: external_key, type: varchar(512) }
        - addForeignKeyConstraint: { baseTableName: calendar_source, baseColumnNames: user_id, referencedTableName: app_user, referencedColumnNames: id, constraintName: fk_app_calendar_source_user }
        - addForeignKeyConstraint: { baseTableName: calendar_source, baseColumnNames: calendar_id, referencedTableName: app_calendar, referencedColumnNames: calendar_id, constraintName: fk_app_calendar_source_calendar }
        - addForeignKeyConstraint: { baseTableName: calendar_event, baseColumnNames: source_id, referencedTableName: calendar_source, referencedColumnNames: source_id, constraintName: fk_app_calendar_event_source }
        - createIndex:
            tableName: calendar_source
            indexName: idx_app_calendar_source_user
            ifNotExists: true
            columns:
              - column: { name: user_id }
        - createIndex:
            tableName: calendar_event
            indexName: idx_app_calendar_event_source
            ifNotExists: true
            columns:
              - column: { name: source_id }
        - sql:
            sql: CREATE UNIQUE INDEX IF NOT EXISTS idx_app_calendar_event_source_key ON calendar_event (source_id, external_key) WHERE soft_deleted = FALSE AND source_id IS NOT NULL
