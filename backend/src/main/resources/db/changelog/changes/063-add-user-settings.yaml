databaseChangeLog:
  - changeSet:
      id: 063-add-user-settings
      author: codex
      comment: Persist user-facing behavior, audio, appearance, and timer settings per account
      changes:
        - addColumn:
            tableName: app_user
            columns:
              - column:
                  name: show_completed_home_tasks
                  type: boolean
              - column:
                  name: exclude_today_completed_tasks
                  type: boolean
              - column:
                  name: show_closed_mental_threads
                  type: boolean
              - column:
                  name: sound_effects_enabled
                  type: boolean
              - column:
                  name: white_noise_enabled
                  type: boolean
              - column:
                  name: pomodoro_seconds_mode
                  type: boolean
              - column:
                  name: pomodoro_long_break_cooldown
                  type: int
              - column:
                  name: theme_mode
                  type: varchar(16)
              - column:
                  name: accent_color
                  type: varchar(32)
              - column:
                  name: meditation_duration_minutes
                  type: int
              - column:
                  name: meditation_interval_bells
                  type: int
              - column:
                  name: meditation_sound
                  type: varchar(32)
      rollback:
        - dropColumn:
            tableName: app_user
            columnName: show_completed_home_tasks
        - dropColumn:
            tableName: app_user
            columnName: exclude_today_completed_tasks
        - dropColumn:
            tableName: app_user
            columnName: show_closed_mental_threads
        - dropColumn:
            tableName: app_user
            columnName: sound_effects_enabled
        - dropColumn:
            tableName: app_user
            columnName: white_noise_enabled
        - dropColumn:
            tableName: app_user
            columnName: pomodoro_seconds_mode
        - dropColumn:
            tableName: app_user
            columnName: pomodoro_long_break_cooldown
        - dropColumn:
            tableName: app_user
            columnName: theme_mode
        - dropColumn:
            tableName: app_user
            columnName: accent_color
        - dropColumn:
            tableName: app_user
            columnName: meditation_duration_minutes
        - dropColumn:
            tableName: app_user
            columnName: meditation_interval_bells
        - dropColumn:
            tableName: app_user
            columnName: meditation_sound
