databaseChangeLog:
  - changeSet:
      id: 028-create-mental-state-check-in
      author: osama
      comment: Store combined mental-state snapshots without a one-entry-per-day restriction
      changes:
        - createTable:
            tableName: mental_state_check_in
            columns:
              - column:
                  name: check_in_id
                  type: varchar(255)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: recorded_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: stimulation
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: hunger
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: arousal
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: valence
                  type: int
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: mental_state_check_in
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_app_mental_state_check_in_user
            onDelete: CASCADE
            onUpdate: CASCADE
        - createIndex:
            tableName: mental_state_check_in
            indexName: idx_app_mental_state_check_in_user_recorded
            ifNotExists: true
            columns:
              - column:
                  name: user_id
              - column:
                  name: recorded_at
                  descending: true
      rollback:
        - dropTable:
            tableName: mental_state_check_in

  - changeSet:
      id: 028-migrate-complete-daily-mental-state-snapshots
      author: osama
      dbms: postgresql
      comment: Preserve dates where all four legacy mental-state stats were recorded
      changes:
        - sql:
            sql: |
              INSERT INTO mental_state_check_in
                  (check_in_id, user_id, recorded_at, stimulation, hunger, arousal, valence)
              SELECT min(entry.id),
                     entry.user_id,
                     CAST(entry.date AS timestamp),
                     CAST(max(CASE WHEN definition.system_key = 'stimulation' THEN entry.stat_value END) AS int),
                     CAST(max(CASE WHEN definition.system_key = 'hunger' THEN entry.stat_value END) AS int),
                     CAST(max(CASE WHEN definition.system_key = 'arousal' THEN entry.stat_value END) AS int),
                     CAST(max(CASE WHEN definition.system_key = 'valence' THEN entry.stat_value END) AS int)
              FROM stat_entry entry
              JOIN stat_definition definition ON definition.id = entry.stat_definition_id
              WHERE definition.system_key IN ('stimulation', 'hunger', 'arousal', 'valence')
              GROUP BY entry.user_id, entry.date
              HAVING count(DISTINCT definition.system_key) = 4;
      rollback:
        - sql:
            sql: |
              DELETE FROM mental_state_check_in
              WHERE check_in_id IN (
                  SELECT min(entry.id)
                  FROM stat_entry entry
                  JOIN stat_definition definition ON definition.id = entry.stat_definition_id
                  WHERE definition.system_key IN ('stimulation', 'hunger', 'arousal', 'valence')
                  GROUP BY entry.user_id, entry.date
                  HAVING count(DISTINCT definition.system_key) = 4
              );
