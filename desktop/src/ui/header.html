<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <title>Claritard header</title>
    <link rel="stylesheet" href="header.css">
</head>
<body>
    <header class="bar">
        <div class="brand">
            <img class="logo" src="../../assets/icon.png" alt="">
            <span class="name">Claritard</span>
            <button class="mode" id="mode" type="button"><span class="dot"></span><span id="mode-label"></span></button>
        </div>
        <div class="controls">
            <span class="update" id="update" role="status" hidden>
                <span class="update-label" id="update-label"></span>
                <span class="update-track" aria-hidden="true"><span class="update-fill" id="update-fill"></span></span>
            </span>
            <button class="icon-button" id="menu" type="button" aria-label="Menu" title="Menu">
                <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="3" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="8" cy="13" r="1.4"/></svg>
            </button>
            <span class="divider" aria-hidden="true"></span>
            <button class="icon-button" id="minimize" type="button" aria-label="Minimize" title="Minimize">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5h9" /></svg>
            </button>
            <button class="icon-button" id="maximize" type="button" aria-label="Maximize" title="Maximize">
                <svg class="when-normal" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg>
                <svg class="when-maximized" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="5.5" width="7" height="7" rx="1.2"/><path d="M5.5 3.5h5.5a1.5 1.5 0 0 1 1.5 1.5v5.5"/></svg>
            </button>
            <button class="icon-button close" id="close" type="button" aria-label="Close" title="Close">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
            </button>
        </div>
    </header>
    <script src="theme.js"></script>
    <script src="header.js"></script>
</body>
</html>
